name: publisher-validation

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and tests
        run: |
          python -m py_compile src/gen9_t4_ocsd.py tests/test_publisher.py
      - name: Run hardware-independent tests
        run: python -m unittest discover -s tests -v
      - name: Static source verification
        run: python scripts/verify_candidate.py .
